name: Bug report
description: Report a reproducible gameplay, tooling, or engine-safety problem
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Replay/state evidence is especially useful for gameplay issues.
  - type: input
    id: version
    attributes:
      label: Agent / deck version
      placeholder: "e.g. Mega Lucario v30"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behaviour and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should the agent or tool have done instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction / evidence
      description: Add steps, replay information, game state, logs, or a minimal scenario.
      placeholder: "Replay / turn / matchup / command / relevant logs"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agent decision / heuristic
        - RL / model
        - Simulator / environment
        - Replay / evaluation tooling
        - Engine safety / crash
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include opponent archetype, seeds, screenshots, or anything else that may matter.
